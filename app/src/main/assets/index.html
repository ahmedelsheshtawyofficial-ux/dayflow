<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f3f3ff"><title>Dayflow</title>
<style>
:root{--bg:#f3f3ff;--paper:#fff;--ink:#171b3c;--muted:#8589a8;--blue:#345be8;--blue2:#5678f5;--line:#ececf7;--lav:#e9eaff;--green:#43a875;--purple:#9254d6;--shadow:0 10px 28px #3949a012}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background:linear-gradient(150deg,#f5f5ff 0%,#f0f1ff 100%)}header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;flex-shrink:0}.brand{font-size:23px;font-weight:900;letter-spacing:-1.2px}.brand span{color:var(--blue)}.icon{border:0;background:transparent;color:#51577e;font-size:22px;width:38px;height:38px;border-radius:12px}main{flex:1;overflow:auto;padding:12px 20px 104px;scrollbar-width:none}.greet{display:flex;justify-content:space-between;align-items:center;margin:6px 0 20px}.eyebrow{font-size:11px;color:#777da0;margin-bottom:5px}.greet h1{font-size:27px;letter-spacing:-1px;margin:0;font-weight:850}.sub{font-size:11px;color:var(--muted);margin-top:5px}.avatar{height:43px;width:43px;border-radius:50%;background:linear-gradient(135deg,#dce2ff,#aebdff);display:grid;place-items:center;color:#3149ad;font-weight:850;border:3px solid white;box-shadow:var(--shadow)}.search{height:43px;background:#e9eaff;border-radius:14px;display:flex;align-items:center;padding:0 13px;gap:9px;margin-bottom:17px;color:#73799e}.search input{border:0;background:transparent;outline:0;flex:1;font-size:12px;color:var(--ink);min-width:0}.filters{display:flex;gap:7px;margin-bottom:17px;overflow:auto;scrollbar-width:none}.chip{border:0;border-radius:20px;padding:8px 14px;background:#fff;color:#737895;font-size:11px;white-space:nowrap}.chip.active{background:var(--blue);color:white;box-shadow:0 5px 12px #345be833}.tasklist{display:flex;flex-direction:column;gap:9px}.task{background:white;border-radius:15px;min-height:66px;padding:11px 12px;display:flex;align-items:center;gap:11px;box-shadow:0 3px 12px #263b8a08;border:1px solid #f0f0fa}.stripe{width:3px;align-self:stretch;border-radius:4px;background:var(--blue)}.check{width:20px;height:20px;border:1.5px solid #b9bfd8;border-radius:50%;background:white;flex-shrink:0;color:white;font-size:12px}.check.done{background:var(--blue);border-color:var(--blue)}.taskbody{flex:1;min-width:0}.tasktitle{font-size:12px;font-weight:750;overflow-wrap:anywhere}.tasktitle.done{text-decoration:line-through;color:#a5a8bc}.meta{font-size:10px;color:#858aa6;margin-top:5px;display:flex;align-items:center;gap:5px}.tag{font-size:9px;font-weight:700;padding:5px 8px;border-radius:9px;background:#edf0ff;color:#345be8;white-space:nowrap}.tag.personal{background:#e7f6ec;color:#398d60}.tag.learning{background:#f2eaff;color:#8750c7}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 1px 12px}.section h2{font-size:18px;margin:0;letter-spacing:-.5px}.muted{font-size:10px;color:var(--muted);margin-top:4px}.progress{background:white;border-radius:17px;padding:15px 16px;margin:0 0 22px;box-shadow:var(--shadow)}.row{display:flex;align-items:center;justify-content:space-between}.smallcaps{font-size:9px;font-weight:850;letter-spacing:1px;color:#8187a8}.count{font-size:25px;font-weight:850;margin-top:4px}.count small{font-size:12px;color:#969bb3;font-weight:500}.percent{background:#e9edff;color:var(--blue);font-size:11px;font-weight:800;padding:8px 11px;border-radius:12px}.track{height:6px;background:#f0f1fa;border-radius:9px;margin-top:12px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#345be8,#8295ff);border-radius:9px;transition:width .2s}.hint{font-size:10px;color:#969bb1;margin-top:9px}.fab{position:absolute;right:23px;bottom:88px;width:54px;height:54px;border:0;border-radius:19px;background:var(--blue);color:white;font-size:30px;box-shadow:0 8px 18px #345be844;z-index:2}.bottom{height:72px;flex-shrink:0;background:#ffffffed;border-top:1px solid #e8e9f5;display:flex;justify-content:space-around;padding:7px 5px max(5px,env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.nav{border:0;background:transparent;flex:1;color:#969ab2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:9px}.nav b{font-size:20px;font-weight:500}.nav.active{color:var(--blue);font-weight:800}.empty{text-align:center;padding:28px 10px;color:#9297b0;font-size:12px;background:white;border-radius:16px}.calendar-head{display:flex;justify-content:space-between;align-items:center;margin:10px 0 18px}.calendar-head h2{margin:0;font-size:20px}.monthnav{border:0;background:white;border-radius:10px;width:32px;height:32px;color:var(--blue);font-size:18px}.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.weekdays{font-size:9px;color:#9297b0;margin-bottom:8px}.day{height:39px;border:0;background:transparent;border-radius:12px;color:#4c5274;font-size:11px;position:relative}.day.selected{background:var(--blue);color:white;font-weight:800}.day.today:not(.selected){background:#e4e9ff;color:var(--blue);font-weight:800}.day.has:after{content:'';position:absolute;width:4px;height:4px;border-radius:50%;background:#8a63d8;bottom:3px;left:calc(50% - 2px)}.panel{background:white;border-radius:17px;padding:15px;margin-top:17px;box-shadow:var(--shadow)}.panel h3{font-size:14px;margin:0 0 12px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:white;border-radius:16px;padding:16px;box-shadow:var(--shadow)}.stat strong{font-size:24px;display:block;color:var(--blue)}.stat span{font-size:10px;color:var(--muted)}.barrow{display:flex;align-items:center;gap:9px;margin:12px 0;font-size:10px;color:#737895}.bar{height:7px;border-radius:9px;background:#edf0ff;flex:1;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:9px}.setting{display:flex;align-items:center;gap:12px;padding:15px 2px;border-bottom:1px solid var(--line);font-size:12px}.setting:last-child{border:0}.setting .sicon{width:34px;height:34px;border-radius:11px;background:#eff0ff;display:grid;place-items:center;color:var(--blue);font-size:16px}.setting small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.setting .arrow{margin-left:auto;color:#a4a8bd}.modal{position:fixed;inset:0;background:#161b3c66;display:none;align-items:flex-end;justify-content:center;z-index:5}.sheet{width:100%;max-width:520px;background:white;border-radius:25px 25px 0 0;padding:18px 21px 28px;max-height:90dvh;overflow:auto}.handle{width:38px;height:4px;background:#e4e6f0;border-radius:9px;margin:0 auto 17px}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.sheet h2{font-size:19px;margin:0}.close{border:0;background:transparent;font-size:22px;color:#777d99}.field{margin:12px 0}.field label{font-size:10px;color:#858aa7;display:block;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #e5e7f2;border-radius:12px;padding:12px;font:inherit;font-size:12px;color:var(--ink);background:white;outline:none}.field textarea{height:68px;resize:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{width:100%;height:46px;border:0;border-radius:14px;background:var(--blue);color:white;font-weight:800;margin-top:12px}.secondary{background:#eff1ff;color:var(--blue)}.detailmeta{display:flex;gap:10px;flex-wrap:wrap;color:#7f85a3;font-size:11px;margin:12px 0}.subtask{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.subtask input{accent-color:var(--blue)}
</style></head>
<body><div class="app"><header><button class="icon" id="menu">☰</button><div class="brand">dayflow<span>.</span></div><button class="icon" id="searchBtn">⌕</button></header><main id="content"></main><button class="fab" id="fab">+</button><nav class="bottom" id="bottom"></nav></div>
<div class="modal" id="modal"><div class="sheet"><div class="handle"></div><div class="sheethead"><h2 id="modalTitle">Add a New Task</h2><button class="close" id="close">×</button></div><div class="field"><label>Task title</label><input id="title" placeholder="What needs to get done?"></div><div class="two"><div class="field"><label>Due date</label><input id="due" type="date"></div><div class="field"><label>Category</label><select id="category"><option>Work</option><option>Personal</option><option>Learning</option><option>Health</option></select></div></div><div class="two"><div class="field"><label>Time</label><input id="time" type="time"></div><div class="field"><label>Priority</label><select id="priority"><option>Normal</option><option>High</option><option>Low</option></select></div></div><div class="field"><label>More details</label><textarea id="details" placeholder="Add notes or details..."></textarea></div><button class="primary" id="saveTask">Add Task</button></div></div>
<div class="modal" id="detailModal"><div class="sheet"><div class="handle"></div><div class="sheethead"><h2>Task Details</h2><button class="close" id="detailClose">×</button></div><div id="detailContent"></div></div></div>
<script>
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const seed=[{id:1,title:'Finish project proposal',date:todayISO(),time:'10:00',category:'Work',priority:'High',details:'Prepare the final version of the project proposal and share it with the team.',done:false,subs:['Review project brief','Prepare presentation']},{id:2,title:'Buy groceries',date:todayISO(),time:'17:00',category:'Personal',priority:'Normal',details:'',done:false,subs:[]},{id:3,title:'Call the design team',date:tomorrow(),time:'11:00',category:'Work',priority:'Normal',details:'Discuss the latest design updates.',done:false,subs:[]},{id:4,title:'Read design guidelines',date:tomorrow(),time:'14:00',category:'Learning',priority:'Low',details:'',done:true,subs:[]}];function tomorrow(){let d=new Date();d.setDate(d.getDate()+1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
let tasks=JSON.parse(localStorage.getItem('dayflow.tasks.v2')||'null')||seed,tab='Home',filter='All',selectedDate=todayISO(),month=new Date();const save=()=>localStorage.setItem('dayflow.tasks.v2',JSON.stringify(tasks));const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});const color=c=>({Work:'#345be8',Personal:'#43a875',Learning:'#9254d6',Health:'#df8a62'}[c]||'#345be8');
function nav(){const tabs=[['Home','⌂'],['Calendar','▦'],['Insights','▥'],['Settings','⚙']];document.getElementById('bottom').innerHTML=tabs.map(([n,i])=>`<button class="nav ${tab===n?'active':''}" data-tab="${n}"><b>${i}</b>${n}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function taskHTML(t){return `<div class="task" data-open="${t.id}"><i class="stripe" style="background:${color(t.category)}"></i><button class="check ${t.done?'done':''}" data-check="${t.id}">${t.done?'✓':''}</button><div class="taskbody"><div class="tasktitle ${t.done?'done':''}">${esc(t.title)}</div><div class="meta">▢ ${fmt(t.date)} · ${t.time||'Any time'}</div></div><span class="tag ${t.category.toLowerCase()}">${esc(t.category)}</span></div>`}
function renderHome(){let done=tasks.filter(t=>t.done).length,pct=tasks.length?Math.round(done/tasks.length*100):0;let visible=tasks.filter(t=>filter==='All'||(filter==='Completed'?t.done:filter==='Today'?t.date===todayISO():t.date>todayISO()));document.getElementById('content').innerHTML=`<div class="greet"><div><div class="eyebrow">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div><h1>Good morning 👋</h1><div class="sub">Make today count, one task at a time.</div></div><div class="avatar">A</div></div><div class="search"><span>⌕</span><input id="search" placeholder="Search tasks..."><span>☷</span></div><div class="filters">${['All','Today','Upcoming','Completed'].map(f=>`<button class="chip ${filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div><div class="progress"><div class="row"><div><div class="smallcaps">TODAY'S PROGRESS</div><div class="count">${tasks.filter(t=>t.done&&t.date===todayISO()).length}<small> / ${tasks.filter(t=>t.date===todayISO()).length} tasks</small></div></div><div class="percent">${pct}%</div></div><div class="track"><div class="fill" style="width:${pct}%"></div></div><div class="hint">${pct===100?'You did it! Enjoy your free time.':'Keep moving forward. You are doing great!'}</div></div><div class="section"><div><h2>My Tasks</h2><div class="muted">Your priorities, all in one place.</div></div><span class="muted">${visible.length} tasks</span></div><div class="tasklist">${visible.length?visible.map(taskHTML).join(''):'<div class="empty">No tasks here. Add a task to get started.</div>'}</div>`;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-check]').forEach(b=>b.onclick=e=>{e.stopPropagation();let t=tasks.find(x=>x.id==b.dataset.check);t.done=!t.done;save();render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(+b.dataset.open));document.getElementById('search').oninput=e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('.task').forEach(el=>el.style.display=el.innerText.toLowerCase().includes(q)?'flex':'none')};}
function renderCalendar(){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),title=month.toLocaleDateString('en-US',{month:'long',year:'numeric'});let cells='';for(let i=0;i<first;i++)cells+='<span></span>';for(let d=1;d<=days;d++){let iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells+=`<button class="day ${iso===selectedDate?'selected':''} ${iso===todayISO()?'today':''} ${tasks.some(t=>t.date===iso)?'has':''}" data-date="${iso}">${d}</button>`}let list=tasks.filter(t=>t.date===selectedDate);document.getElementById('content').innerHTML=`<div class="section"><div><h2>Calendar</h2><div class="muted">Plan your days with clarity.</div></div></div><div class="panel"><div class="calendar-head"><button class="monthnav" id="prev">‹</button><h2>${title}</h2><button class="monthnav" id="next">›</button></div><div class="weekdays">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<span>${x}</span>`).join('')}</div><div class="days">${cells}</div></div><div class="section"><div><h2>${fmt(selectedDate)}</h2><div class="muted">Your schedule for this day</div></div></div><div class="tasklist">${list.length?list.map(taskHTML).join(''):'<div class="empty">Nothing planned for this day.</div>'}</div>`;document.getElementById('prev').onclick=()=>{month=new Date(y,m-1,1);render()};document.getElementById('next').onclick=()=>{month=new Date(y,m+1,1);render()};document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;render()});document.querySelectorAll('[data-check]').forEach(b=>b.onclick=e=>{e.stopPropagation();let t=tasks.find(x=>x.id==b.dataset.check);t.done=!t.done;save();render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(+b.dataset.open))}
function renderInsights(){let done=tasks.filter(t=>t.done).length,open=tasks.length-done;let cats=['Work','Personal','Learning','Health'];document.getElementById('content').innerHTML=`<div class="section"><div><h2>Insights</h2><div class="muted">A snapshot of your productivity.</div></div></div><div class="statgrid"><div class="stat"><strong>${tasks.length}</strong><span>Total tasks</span></div><div class="stat"><strong>${done}</strong><span>Completed</span></div><div class="stat"><strong>${open}</strong><span>In progress</span></div><div class="stat"><strong>${tasks.length?Math.round(done/tasks.length*100):0}%</strong><span>Completion rate</span></div></div><div class="panel" style="margin-top:14px"><h3>Tasks by category</h3>${cats.map(c=>{let n=tasks.filter(t=>t.category===c).length;return `<div class="barrow"><span style="width:65px">${c}</span><div class="bar"><i style="width:${tasks.length?n/tasks.length*100:0}%;background:${color(c)}"></i></div><b>${n}</b></div>`}).join('')}</div><div class="panel"><h3>Keep your momentum</h3><div class="muted">Small consistent steps make meaningful progress. Review your tasks daily and celebrate what you complete.</div></div>`}
function renderSettings(){document.getElementById('content').innerHTML=`<div class="section"><div><h2>Settings</h2><div class="muted">Make Dayflow work your way.</div></div></div><div class="panel"><div class="greet" style="margin:0"><div style="display:flex;align-items:center;gap:12px"><div class="avatar">A</div><div><b style="font-size:13px">Dayflow User</b><div class="muted">Your personal workspace</div></div></div><span style="color:var(--blue)">›</span></div></div><div class="panel" style="margin-top:14px;padding:5px 15px"><div class="setting"><span class="sicon">♧</span><div>Notifications<small>Task reminders and alerts</small></div><span class="arrow">›</span></div><div class="setting"><span class="sicon">☾</span><div>Appearance<small>Light theme</small></div><span class="arrow">System　›</span></div><div class="setting"><span class="sicon">⇧</span><div>Data & backup<small>Your tasks are stored on this device</small></div><span class="arrow">›</span></div><div class="setting"><span class="sicon">ⓘ</span><div>About Dayflow<small>Version 1.1.0</small></div><span class="arrow">›</span></div></div><div class="muted" style="text-align:center;margin:22px">Plan · Organize · Get it done</div>`}
function render(){nav();if(tab==='Home')renderHome();if(tab==='Calendar')renderCalendar();if(tab==='Insights')renderInsights();if(tab==='Settings')renderSettings();document.getElementById('fab').style.display=tab==='Home'||tab==='Calendar'?'block':'none'}
function openModal(){document.getElementById('modal').style.display='flex';document.getElementById('due').value=selectedDate||todayISO();document.getElementById('title').focus()}function closeModal(){document.getElementById('modal').style.display='none'}document.getElementById('fab').onclick=openModal;document.getElementById('close').onclick=closeModal;document.getElementById('cancel')?.addEventListener('click',closeModal);document.getElementById('saveTask').onclick=()=>{let title=document.getElementById('title').value.trim();if(!title){document.getElementById('title').focus();return}tasks.unshift({id:Date.now(),title,date:document.getElementById('due').value||todayISO(),time:document.getElementById('time').value,category:document.getElementById('category').value,priority:document.getElementById('priority').value,details:document.getElementById('details').value,done:false,subs:[]});save();['title','time','details'].forEach(id=>document.getElementById(id).value='');closeModal();tab='Home';filter='All';render()};
function openDetail(id){let t=tasks.find(x=>x.id===id);if(!t)return;document.getElementById('detailContent').innerHTML=`<h2 style="font-size:18px">${esc(t.title)}</h2><div class="detailmeta">▢ ${fmt(t.date)} · ${t.time||'Any time'}　<span class="tag ${t.category.toLowerCase()}">${t.category}</span>　${t.priority} priority</div><p style="font-size:12px;color:#737995;line-height:1.6">${esc(t.details||'No additional details.')}</p><div class="section"><h2 style="font-size:14px">Subtasks (${t.subs.filter((s,i)=>t.subDone?.[i]).length}/${t.subs.length})</h2></div>${t.subs.map((s,i)=>`<label class="subtask"><input type="checkbox" data-sub="${i}" ${t.subDone?.[i]?'checked':''}>${esc(s)}</label>`).join('')}<button class="primary" id="toggleDone">${t.done?'Mark as incomplete':'Mark as completed'}</button><button class="primary secondary" id="deleteTask">Delete task</button>`;document.getElementById('detailModal').style.display='flex';document.getElementById('detailClose').onclick=()=>document.getElementById('detailModal').style.display='none';document.getElementById('toggleDone').onclick=()=>{t.done=!t.done;save();document.getElementById('detailModal').style.display='none';render()};document.getElementById('deleteTask').onclick=()=>{tasks=tasks.filter(x=>x.id!==id);save();document.getElementById('detailModal').style.display='none';render()};document.querySelectorAll('[data-sub]').forEach(c=>c.onchange=()=>{t.subDone=t.subDone||[];t.subDone[+c.dataset.sub]=c.checked;save();openDetail(id)})}
document.getElementById('searchBtn').onclick=()=>{tab='Home';render();document.getElementById('search')?.focus()};document.getElementById('menu').onclick=()=>{tab='Settings';render()};render();
</script></body></html>
